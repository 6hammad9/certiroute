[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certiroute"
version = "0.1.0"
description = "Certainty-aware heat-risk scheduling for mobile outdoor crews"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "altair>=5,<7",
  "folium>=0.20,<1",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pydeck>=0.9,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "streamlit>=1.37,<2",
  "streamlit-folium>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/certiroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
